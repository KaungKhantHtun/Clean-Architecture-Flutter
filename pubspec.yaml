name: clean_architecture_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  
  go_router: ^17.1.0
  get_it: ^9.2.0
  dio: ^5.9.0
  dart_either: ^2.0.0
  flutter_riverpod: ^3.1.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  riverpod_lint: ^3.1.0
  custom_lint: ^0.8.1

flutter:
  uses-material-design: true

  assets:
    - assets/translations/

analyzer:
  plugins:
    - custom_lint
